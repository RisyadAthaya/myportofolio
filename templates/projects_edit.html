{% extends "base.html" %}
{% block meta %}
<title>Edit Project - {{ nickname }}</title>
{% endblock meta %}
{% block content %}
<main>
  <section class="projects-page-section">
    <div class="container">
      <h1>Edit Project</h1>
      <form method="post"
            action="{% url 'main:edit_project' project.id %}"
            class="form">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
          <p class="form-error">{{ error }}</p>
          {% endfor %}
        </div>
        {% endfor %}
        <div class="form-buttons">
          <button type="submit" class="button">Simpan Perubahan</button>
          <a href="{% url 'main:show_projects' %}" class="button button-danger">Batal</a>
        </div>
      </form>
    </div>
  </section>
</main>
{% endblock content %}
